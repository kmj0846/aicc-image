<title>거실 무드 스튜디오</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 작업대(사진·뷰어)가 위, 제안 카드가 아래. 넓은 화면에선 뷰어 옆에 옵션 패널. */
:root {
  --bg: #f4f4f1;
  --surface: #ffffff;
  --sunk: #ebebe6;
  --ink: #1d1f1c;
  --muted: #676a62;
  --line: #dcdcd4;
  --accent: #2f5d50;      /* 솔잎색: 주요 동작 */
  --accent-ink: #ffffff;
  --add: #b9772f;         /* 원목색: 더하기 */
  --remove: #b5473b;      /* 빼기 */
  --move: #4a6d9a;        /* 옮기기 */
  --shadow: 0 1px 2px rgba(20,24,20,.06), 0 6px 20px rgba(20,24,20,.06);
  --f-display: "Gowun Batang", "Nanum Myeongjo", "AppleMyungjo", serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161816; --surface: #1f221f; --sunk: #2a2d29; --ink: #ecebe5; --muted: #a2a59b;
    --line: #353932; --accent: #7fb3a2; --accent-ink: #0f1a16; --add: #dca463; --remove: #e07f72; --move: #8fb0db;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161816; --surface: #1f221f; --sunk: #2a2d29; --ink: #ecebe5; --muted: #a2a59b;
  --line: #353932; --accent: #7fb3a2; --accent-ink: #0f1a16; --add: #dca463; --remove: #e07f72; --move: #8fb0db;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 64px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1 { font-family: var(--f-display); font-size: 26px; letter-spacing: -.01em; }
h2 { font-family: var(--f-display); font-size: 20px; }
h3 { font-size: 15px; font-weight: 600; }
p { margin: 0; }
.muted { color: var(--muted); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 12px; letter-spacing: .08em; color: var(--muted); font-weight: 500; }

header.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; margin-bottom: 18px; }
.tabs { display: flex; gap: 4px; background: var(--sunk); padding: 4px; border-radius: 10px; }
.tabs button { border: 0; background: transparent; color: var(--muted); font: 500 14px var(--f-body); padding: 8px 14px; border-radius: 7px; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

button, .btn { font-family: var(--f-body); }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 8px 14px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.small { padding: 5px 10px; font-size: 13px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: start; }
@media (max-width: 900px) { .grid { grid-template-columns: minmax(0,1fr); } }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 14px; min-width: 0; }
.field { display: grid; gap: 6px; }
.field > label, .field > .lbl { font-size: 13px; font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 5px 11px; font-size: 13px; cursor: pointer; font-family: var(--f-body); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
select, input[type="text"], input[type="number"] { font: 14px var(--f-body); padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); width: 100%; }

.thumbs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.thumb { position: relative; flex: 0 0 auto; width: 76px; height: 76px; border-radius: 8px; overflow: hidden; border: 2px solid transparent; cursor: pointer; padding: 0; background: var(--sunk); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb[aria-current="true"] { border-color: var(--accent); }
.thumb .x { position: absolute; top: 2px; right: 2px; width: 20px; height: 20px; border-radius: 50%; border: 0; background: rgba(0,0,0,.55); color: #fff; font-size: 12px; line-height: 20px; cursor: pointer; padding: 0; }
.thumb.add { display: grid; place-items: center; border: 1.5px dashed var(--line); color: var(--muted); font-size: 12px; text-align: center; line-height: 1.3; }
.dropzone.drag { outline: 2px dashed var(--accent); outline-offset: 4px; border-radius: 10px; }

.viewer { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; min-width: 0; }
.viewer-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.toggles { display: flex; flex-wrap: wrap; gap: 6px; }
.tg { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; cursor: pointer; user-select: none; background: var(--surface); color: var(--ink); font-family: var(--f-body); }
.tg .dot { width: 8px; height: 8px; border-radius: 50%; }
.tg[aria-pressed="false"] { opacity: .45; }
.stage { position: relative; background: #0d0e0d; touch-action: pan-y; }
.stage canvas { display: block; width: 100%; height: auto; }
.stage .after-clip { position: absolute; inset: 0; overflow: hidden; }
.stage .after-clip canvas { position: absolute; top: 0; left: 0; }
.handle { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.25); cursor: ew-resize; }
.handle::after { content: "⟷"; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 34px; height: 34px; border-radius: 50%; background: #fff; color: #222; display: grid; place-items: center; font-size: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.35); }
.stage .tag { position: absolute; top: 10px; padding: 2px 8px; border-radius: 6px; background: rgba(0,0,0,.6); color: #fff; font-size: 12px; pointer-events: none; }
.stage .tag.l { left: 10px; } .stage .tag.r { right: 10px; }
.viewer-foot { padding: 10px 12px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: center; border-top: 1px solid var(--line); font-size: 13px; }

.status { font-size: 13px; padding: 10px 12px; border-radius: 8px; background: var(--sunk); }
.status.err { background: color-mix(in srgb, var(--remove) 14%, var(--surface)); }
.spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -1px; margin-right: 6px; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }

.summary { margin-top: 22px; display: grid; gap: 10px; }
.summary .headline { font-family: var(--f-display); font-size: 22px; line-height: 1.4; max-width: 46ch; }
.summary .diag { max-width: 68ch; color: var(--muted); }
.kv { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 13px; }
.kv b { font-weight: 600; }
.palette { display: flex; gap: 4px; align-items: center; }
.sw { width: 22px; height: 22px; border-radius: 5px; border: 1px solid rgba(0,0,0,.12); }

.cols { margin-top: 20px; display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 16px; }
@media (max-width: 900px) { .cols { grid-template-columns: minmax(0,1fr); } }
.col { display: grid; gap: 10px; align-content: start; min-width: 0; }
.col-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding-bottom: 6px; border-bottom: 2px solid var(--c); }
.col-h h2 { color: var(--c); font-size: 18px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 12px 12px 14px; display: grid; gap: 4px; cursor: pointer; text-align: left; color: var(--ink); font: inherit; width: 100%; }
.card:hover, .card.hot { border-color: var(--c); box-shadow: 0 0 0 1px var(--c); }
.card .t { display: flex; gap: 8px; align-items: baseline; font-weight: 600; }
.card .n { flex: 0 0 auto; width: 20px; height: 20px; border-radius: 50%; background: var(--c); color: #fff; font: 600 11px/20px var(--f-mono); text-align: center; }
.card .r { font-size: 13.5px; color: var(--muted); }
.card .meta { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12.5px; margin-top: 2px; }
.card .meta a { color: var(--accent); }
.card .price { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

.lower { margin-top: 24px; display: grid; grid-template-columns: minmax(0,1.2fr) minmax(0,1fr); gap: 16px; }
@media (max-width: 900px) { .lower { grid-template-columns: minmax(0,1fr); } }
.plan-wrap { overflow-x: auto; }
.plan svg { width: 100%; height: auto; display: block; max-width: 520px; margin: 0 auto; }
.plan text { font-family: var(--f-body); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--muted); }
.light-list { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 14px; }
.prompt-box { font-family: var(--f-mono); font-size: 12.5px; background: var(--sunk); border-radius: 8px; padding: 10px 12px; white-space: pre-wrap; word-break: break-word; max-height: 180px; overflow: auto; }
.budget { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.budget .big { font-family: var(--f-mono); font-size: 22px; font-weight: 500; }

/* 소품 미리보기 */
.try-grid { display: grid; grid-template-columns: minmax(0,1fr) 320px; gap: 20px; align-items: start; }
@media (max-width: 900px) { .try-grid { grid-template-columns: minmax(0,1fr); } }
#tryStage { position: relative; background: #0d0e0d; touch-action: none; cursor: grab; }
#tryStage canvas { display: block; width: 100%; height: auto; }
#tryStage.dragging { cursor: grabbing; }
.range { display: grid; grid-template-columns: 64px minmax(0,1fr) 44px; align-items: center; gap: 8px; font-size: 13px; }
.range input { width: 100%; accent-color: var(--accent); }
.range output { font-family: var(--f-mono); font-size: 12px; text-align: right; color: var(--muted); }
.product-prev { display: flex; gap: 10px; align-items: center; }
.product-prev canvas { width: 72px; height: 72px; border-radius: 8px; background: repeating-conic-gradient(var(--sunk) 0 25%, var(--surface) 0 50%) 0 0/12px 12px; border: 1px solid var(--line); }
.score { display: flex; align-items: center; gap: 14px; }
.score .ring { --p: 0; width: 64px; height: 64px; border-radius: 50%; background: conic-gradient(var(--accent) calc(var(--p) * 1%), var(--sunk) 0); display: grid; place-items: center; flex: 0 0 auto; }
.score .ring span { width: 50px; height: 50px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font: 600 18px var(--f-mono); }
.eval-list { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 14px; }
.eval h3 { margin-top: 6px; }
.note { font-size: 12.5px; color: var(--muted); }
.sample-flag { display: inline-block; font-size: 11.5px; font-weight: 600; letter-spacing: .04em; padding: 2px 8px; border-radius: 999px; background: var(--sunk); color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">시공 없이 바꾸는 우리 집 분위기</div>
      <h1>거실 무드 스튜디오</h1>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-plan" aria-selected="true" aria-controls="view-plan">분위기 제안</button>
      <button role="tab" id="tab-try" aria-selected="false" aria-controls="view-try">소품 미리보기</button>
    </div>
  </header>

  <!-- ───────────── 분위기 제안 ───────────── -->
  <section id="view-plan" role="tabpanel" aria-labelledby="tab-plan">
    <div class="grid">
      <div class="viewer">
        <div class="viewer-bar">
          <div class="toggles" id="toggles">
            <button class="tg" data-k="remove" aria-pressed="true"><span class="dot" style="background:var(--remove)"></span>빼기</button>
            <button class="tg" data-k="add" aria-pressed="true"><span class="dot" style="background:var(--add)"></span>더하기</button>
            <button class="tg" data-k="light" aria-pressed="true"><span class="dot" style="background:#e9b46a"></span>조명</button>
            <button class="tg" data-k="labels" aria-pressed="true"><span class="dot" style="background:var(--ink)"></span>번호</button>
          </div>
          <span class="note" id="viewerNote">가운데 선을 끌어서 전후 비교</span>
        </div>
        <div class="stage" id="stage">
          <canvas id="cvBefore" aria-label="원본 사진"></canvas>
          <div class="after-clip" id="afterClip"><canvas id="cvAfter" aria-label="제안 반영 미리보기"></canvas></div>
          <div class="handle" id="handle" role="slider" tabindex="0" aria-label="전후 비교 위치" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"></div>
          <span class="tag l">지금</span><span class="tag r">제안 후</span>
        </div>
        <div class="viewer-foot">
          <span class="muted">사진 위 그림은 실제 상품이 아니라 위치와 색감을 보여주는 간이 합성이에요.</span>
          <button class="btn small" id="saveAfter" hidden>미리보기 저장</button>
        </div>
      </div>

      <aside class="panel" aria-label="사진과 옵션">
        <div class="field dropzone" id="dropzone">
          <span class="lbl">거실 사진 <span class="muted" style="font-weight:400">· 여러 각도일수록 정확해요</span></span>
          <div class="thumbs" id="thumbs"></div>
          <input type="file" id="fileIn" accept="image/*" multiple hidden>
        </div>
        <div class="field">
          <span class="lbl">원하는 분위기</span>
          <div class="chips" id="styleChips"></div>
        </div>
        <div class="field">
          <label for="budget">예산</label>
          <select id="budget">
            <option value="10">10만원 이하</option>
            <option value="30">30만원 이하</option>
            <option value="50">50만원 이하</option>
            <option value="100">100만원 이하</option>
            <option value="200">200만원 이하</option>
          </select>
        </div>
        <div class="field">
          <span class="lbl">우리 집 조건</span>
          <div class="chips" id="condChips"></div>
        </div>
        <div class="field">
          <label for="memo">더 알려줄 것 <span class="muted" style="font-weight:400">(선택)</span></label>
          <input type="text" id="memo" placeholder="예: 소파는 바꾸기 싫어요, 아이 장난감 수납 필요">
        </div>
        <button class="btn primary" id="analyzeBtn">사진 분석하고 제안 받기</button>
        <div id="analyzeStatus" class="status" hidden></div>
      </aside>
    </div>

    <div id="result"></div>
  </section>

  <!-- ───────────── 소품 미리보기 ───────────── -->
  <section id="view-try" role="tabpanel" aria-labelledby="tab-try" hidden>
    <div class="try-grid">
      <div class="viewer">
        <div class="viewer-bar">
          <div class="thumbs" id="tryThumbs" style="padding:0"></div>
        </div>
        <div id="tryStage"><canvas id="cvTry" aria-label="소품을 올린 거실 사진"></canvas></div>
        <div class="viewer-foot">
          <span class="muted">소품을 끌어서 옮기고, 오른쪽에서 크기와 각도를 맞추세요.</span>
          <button class="btn small" id="saveTry" hidden>이미지 저장</button>
        </div>
      </div>

      <aside class="panel" aria-label="소품 설정">
        <div class="field">
          <span class="lbl">사고 싶은 소품 사진</span>
          <div class="product-prev">
            <canvas id="prodPrev" width="144" height="144"></canvas>
            <div class="row">
              <button class="btn small" id="prodPick">사진 올리기</button>
              <span class="note">쇼핑몰 상품 사진을 저장해서 올리거나 붙여넣기(Ctrl+V)</span>
            </div>
          </div>
          <input type="file" id="prodIn" accept="image/*" hidden>
        </div>
        <div class="field">
          <label for="prodName">상품 이름 · 크기 <span class="muted" style="font-weight:400">(선택)</span></label>
          <input type="text" id="prodName" placeholder="예: 원목 벽시계 지름 30cm">
        </div>
        <div class="field">
          <span class="lbl">배경 지우기</span>
          <div class="range"><span>강도</span><input type="range" id="bgTol" min="0" max="90" value="38"><output id="bgTolO">38</output></div>
        </div>
        <div class="field">
          <span class="lbl">맞추기</span>
          <div class="range"><span>크기</span><input type="range" id="tScale" min="2" max="80" value="14"><output id="tScaleO">14%</output></div>
          <div class="range"><span>각도</span><input type="range" id="tRot" min="-45" max="45" value="0"><output id="tRotO">0°</output></div>
          <div class="range"><span>밝기</span><input type="range" id="tBright" min="50" max="130" value="92"><output id="tBrightO">92</output></div>
          <div class="range"><span>그림자</span><input type="range" id="tShadow" min="0" max="100" value="45"><output id="tShadowO">45</output></div>
        </div>
        <div class="row">
          <button class="btn" id="autoPlace">알맞은 자리 찾기</button>
          <button class="btn primary" id="evalBtn">어울리는지 평가</button>
        </div>
        <div id="tryStatus" class="status" hidden></div>
        <div id="evalOut" class="eval"></div>
      </aside>
    </div>
  </section>
</div>

<script>
/* 예시 데이터: 빌드할 때 사진과 미리 분석한 결과가 들어갑니다. */
const SAMPLE = /*__SAMPLE__*/null;

const $ = (s, r = document) => r.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v;
    else if (k === "style") n.style.cssText = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) n.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) n.append(k.nodeType ? k : String(k));
  return n;
};
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const won = (m) => m >= 10000 ? (m / 10000).toFixed(m % 10000 ? 1 : 0) + "억" : m.toLocaleString("ko-KR") + "만원";

const STYLES = ["아늑하게", "미니멀", "북유럽", "재팬디", "빈티지", "호텔 라운지", "모던 클래식"];
const CONDS = ["전월세(못 박기 어려움)", "아이 있음", "반려동물", "사계절 쓰는 소품 선호", "새로 사기보다 재배치 위주"];

const state = {
  photos: [],          // {name, src, img, w, h}
  sel: 0,
  styles: new Set(["아늑하게"]),
  conds: new Set(),
  analysis: null,
  fromSample: false,
  view: { remove: true, add: true, light: true, labels: true },
  split: 0.5,
  hot: null,
};

/* ───────── 공통: 이미지 로딩 ───────── */
function loadImg(src) {

  const fill = { sofa: "#b9b1a3", chair: "#c9a36b", table: "#e2ddd3", storage: "#d8d6cf", tv: "#2a2a2a", lamp: "#efe2c4", plant: "#7f9665", rug: "#e3d6bf", other: "#cfcabf" };

  s += `<text x="${W / 2}" y="-12" text-anchor="middle" font-size="13" fill="var(--muted)">창</text>`;

    s += `</g>`;
    const ty = it.kind === "rug" ? y + h - 10 : y + h / 2 + 4;
    s += `<text x="${x + w / 2}" y="${ty}" text-anchor="middle" font-size="${it.kind === "rug" ? 13 : 12}" fill="${it.kind === "tv" ? "#fff" : "#2b2a26"}" style="paint-order:stroke" stroke="${it.kind === "tv" ? "#2a2a2a" : "rgba(255,255,255,.7)"}" stroke-width="3">${esc(it.name)}</text>`;
  }

// 상품 사진 배경 지우기: 가장자리에서 시작해 비슷한 색을 따라가며 투명하게
function cutout(img, tol) {
  const max = 900, s = Math.min(1, max / Math.max(img.naturalWidth || img.width, img.naturalHeight || img.height));
  const w = Math.round((img.naturalWidth || img.width) * s), h = Math.round((img.naturalHeight || img.height) * s);

  const d = x.getImageData(0, 0, w, h), D = d.data;

      const seeds = [];

      for (let j = 0; j < h; j++) seeds.push(j * w, j * w + w - 1);
      for (const i of seeds) { const o = i * 4; push(i, D[o], D[o + 1], D[o + 2]); }
      while (qh < qt) {
        const i = q[qh++], px = i % w, py = (i / w) | 0, o = i * 4, r = D[o], g = D[o + 1], b = D[o + 2];
        if (px > 0) push(i - 1, r, g, b); if (px < w - 1) push(i + 1, r, g, b);
        if (py > 0) push(i - w, r, g, b); if (py < h - 1) push(i + w, r, g, b);
      }
      // 경계 부드럽게: 3×3 평균
      const A = new Float32Array(w * h);
      for (let i = 0; i < w * h; i++) A[i] = seen[i] ? 0 : 1;
      for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
        let s2 = 0, n = 0;

}

JSON 하나만 출력: {"cx":소품 중심 x, "cy":소품 중심 y, "width":소품 가로 폭(사진 가로 대비 비율), "rotation":각도(도, 보통 0), "reason":"한국어 한 문장"}`,
      { images: [await canvasBlob(p.img, 1400), await prodBlob()], modelTier: "default" });
    tryS.cx = clamp(+res.cx || .5, 0, 1); tryS.cy = clamp(+res.cy || .4, 0, 1);
    setRange("tScale", clamp(Math.round((+res.width || .14) * 100), 2, 80));
    setRange("tRot", clamp(Math.round(+res.rotation || 0), -45, 45));
    showStatus("#tryStatus", res.reason ? "추천 자리: " + res.reason : "추천 자리에 놓았어요.");
    clearEval(); renderTry();
  } catch (e) { showStatus("#tryStatus", errCopy(e), "err"); }
  finally { btn.disabled = false; }
});
$("#evalBtn").addEventListener("click", async () => {
  if (!tryS.prodCut) { $("#prodIn").click(); return; }
  const sample = await tryNeedsClaude(); if (!sample) return;
  const btn = $("#evalBtn"); btn.disabled = true;
  showStatus("#tryStatus", "어울리는지 살펴보는 중이에요…", "busy");
  try {
    renderTry(true);
    const comp = await canvasBlob(cvT, 1400);
    const res = await sample.json(`당신은 홈스타일링 전문가입니다. 첫 번째 이미지는 사용자의 거실 사진 위에 사려는 소품을 합성한 것이고, 두 번째 이미지는 그 소품만 따로 찍은 상품 사진입니다.
소품 정보: ${tryS.name || "정보 없음"}
합성이 어설픈 점(그림자, 원근)은 평가에서 빼고, 이 소품이 이 공간의 색, 재질, 스타일, 크기와 어울리는지만 판단하세요.
JSON 하나만 출력:
{"score":0~100 정수, "verdict":"한 줄 결론", "good":["어울리는 점"], "concerns":["걸리는 점"], "tips":["더 잘 어울리게 하는 방법(위치, 크기, 색 대안 등)"], "alternative":"이 공간에 더 맞을 비슷한 상품의 특징 한 문장"}
모든 문장은 한국어로 짧고 구체적으로.`,
      { images: [comp, await prodBlob()], modelTier: "default" });
    renderEval(res);
    showStatus("#tryStatus", "");
  } catch (e) { showStatus("#tryStatus", errCopy(e), "err"); }
  finally { btn.disabled = false; renderTry(); }
});
function renderEval(r, isSample = false) {
  const sc = clamp(Math.round(+r.score || 0), 0, 100);
  const list = (t, a) => Array.isArray(a) && a.length ? [el("h3", {}, t), el("ul", { class: "eval-list" }, a.map(x => el("li", {}, String(x))))] : [];
  const out = $("#evalOut"); out.style.opacity = "";
  out.replaceChildren(
    isSample ? el("span", { class: "sample-flag" }, "예시 소품으로 미리 평가한 결과") : null,
    el("div", { class: "score", style: "margin-top:6px" },
      el("div", { class: "ring", style: `--p:${sc}` }, el("span", {}, sc)),
      el("p", { style: "font-weight:600" }, String(r.verdict || ""))),
    ...list("어울리는 점", r.good), ...list("걸리는 점", r.concerns), ...list("이렇게 해 보세요", r.tips),
    r.alternative ? el("p", { class: "note", style: "margin-top:8px" }, "대안: " + r.alternative) : null,
  );
}

(async function boot() {
  if (SAMPLE) {
    state.photos = await Promise.all(SAMPLE.photos.map(async (src, i) => { const img = await loadImg(src); return { name: `사진 ${i + 1}`, src, img, w: img.naturalWidth, h: img.naturalHeight }; }));
    state.analysis = normalizeAnalysis(SAMPLE.analysis);
    state.fromSample = true;
    if (SAMPLE.options) {
      state.styles = new Set(SAMPLE.options.styles); chipGroup($("#styleChips"), STYLES, state.styles);
      state.conds = new Set(SAMPLE.options.conds); chipGroup($("#condChips"), CONDS, state.conds);
      $("#budget").value = String(SAMPLE.options.budget);
    }
    if (SAMPLE.tryon) {
      const t = SAMPLE.tryon;
      tryS.sel = t.photo; tryS.cx = t.cx; tryS.cy = t.cy;
      tryS.prod = await loadImg(t.product); updateCut();
      $("#prodName").value = tryS.name = t.name;
      setRange("tScale", Math.round(t.width * 100));
      renderEval(t.eval, true);
    }
  }
  renderThumbs(); renderViewer(); renderResult();
  let tab = "plan"; try { tab = localStorage.getItem("mood-tab") || "plan"; } catch {}
  if (location.hash === "#try") tab = "try";
  setTab(tab);
  if (!state.photos.length) showStatus("#analyzeStatus", "거실 사진을 올리면 시작해요. 사진을 이 페이지에 끌어다 놓아도 돼요.");
  const dl = await getDownloads();
  if (!dl) { $("#saveAfter").remove(); $("#saveTry").remove(); }
})();
